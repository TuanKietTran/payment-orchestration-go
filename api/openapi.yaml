{"openapi":"3.0.3","info":{"title":"Payment orchestration API","version":"1.0.0","description":"Implemented: create/get/process. Allow commits a recoverable ledger intent before posting; settlement persists LedgerTxID. Capture/refund/list/reconciliation remain planned."},"servers":[{"url":"http://localhost:8102"}],"paths":{"/v1/payments":{"post":{"operationId":"createPayment","summary":"IMPLEMENTED: creates PENDING payment","requestBody":{"required":true,"content":{"application/json":{"schema":{"$ref":"#/components/schemas/CreatePayment"}}}},"responses":{"200":{"description":"Created or same-payload idempotent replay","content":{"application/json":{"schema":{"$ref":"#/components/schemas/CreatePaymentResponse"}}}},"400":{"description":"Invalid request"},"409":{"description":"Idempotency key reused with a different payload"}}},"get":{"operationId":"listPayments","summary":"PLANNED: not implemented","responses":{"200":{"description":"Planned list"}}}},"/v1/payments/{id}":{"get":{"operationId":"getPayment","summary":"IMPLEMENTED: reads payment","parameters":[{"in":"path","name":"id","required":true,"schema":{"type":"string","format":"uuid"}}],"responses":{"200":{"description":"Payment record"},"400":{"description":"Invalid UUID"},"404":{"description":"Not found"}}}},"/v1/payments/{id}/process":{"post":{"summary":"IMPLEMENTED: screens payment and runs allow/review/deny decision","responses":{"200":{"description":"Updated payment state: SETTLED on allow, SCREENED on review, FAILED on deny"},"400":{"description":"Invalid payment UUID"},"502":{"description":"Fraud or ledger dependency failed"}}}},"/v1/payments/{id}/capture":{"post":{"summary":"PLANNED: not implemented","responses":{"202":{"description":"Planned capture"}}}},"/v1/payments/{id}/refunds":{"post":{"summary":"PLANNED: not implemented","responses":{"202":{"description":"Planned refund"}}}},"/v1/reconciliation":{"get":{"summary":"PLANNED: not implemented","responses":{"200":{"description":"Planned reconciliation"}}}}},"components":{"schemas":{"CreatePayment":{"type":"object","required":["idempotency_key","source_account","dest_account","amount","currency"],"properties":{"idempotency_key":{"type":"string"},"source_account":{"type":"string"},"dest_account":{"type":"string"},"amount":{"type":"string","description":"Exact decimal amount"},"currency":{"type":"string","description":"Three-letter currency"}}},"CreatePaymentResponse":{"type":"object","required":["payment_id"],"properties":{"payment_id":{"type":"string","format":"uuid"}}},"Payment":{"type":"object","description":"Current JSON field names are Go PascalCase: ID, IdempotencyKey, SourceAccount, DestAccount, Amount, Currency, Status, LedgerTxID. Status is PENDING, PROCESSING (durable ledger intent awaiting completion), SCREENED (review), FAILED (deny), or SETTLED. LedgerTxID is a UUID string on settlement and null beforehand. Apply migrations 001 and 002 for Postgres recovery. Memory state and simulated ledger are not restart durable."}}}}