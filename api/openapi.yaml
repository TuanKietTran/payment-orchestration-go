{"openapi":"3.0.3","info":{"title":"Payment orchestration API","version":"1.0.0","description":"Implemented: create/get/process/refunds. Allow commits a recoverable ledger intent before posting; settlement persists LedgerTxID. Refund reservations are durable reverse-posting intents. Capture/list/reconciliation remain planned."},"servers":[{"url":"http://localhost:8102"}],"paths":{"/v1/payments":{"post":{"operationId":"createPayment","summary":"IMPLEMENTED: creates PENDING payment","requestBody":{"required":true,"content":{"application/json":{"schema":{"$ref":"#/components/schemas/CreatePayment"}}}},"responses":{"200":{"description":"Created or same-payload idempotent replay","content":{"application/json":{"schema":{"$ref":"#/components/schemas/CreatePaymentResponse"}}}},"400":{"description":"Invalid request"},"409":{"description":"Idempotency key reused with a different payload"}}},"get":{"operationId":"listPayments","summary":"PLANNED: not implemented","responses":{"200":{"description":"Planned list"}}}},"/v1/payments/{id}":{"get":{"operationId":"getPayment","summary":"IMPLEMENTED: reads payment","parameters":[{"in":"path","name":"id","required":true,"schema":{"type":"string","format":"uuid"}}],"responses":{"200":{"description":"Payment record"},"400":{"description":"Invalid UUID"},"404":{"description":"Not found"}}}},"/v1/payments/{id}/process":{"post":{"summary":"IMPLEMENTED: screens payment and runs allow/review/deny decision","responses":{"200":{"description":"Updated payment state: SETTLED on allow, SCREENED on review, FAILED on deny"},"400":{"description":"Invalid payment UUID"},"502":{"description":"Fraud or ledger dependency failed"}}}},"/v1/payments/{id}/capture":{"post":{"summary":"PLANNED: not implemented","responses":{"202":{"description":"Planned capture"}}}},"/v1/payments/{id}/refunds":{"post":{"operationId":"refundPayment","summary":"IMPLEMENTED: reserve and post a partial or full refund","parameters":[{"in":"path","name":"id","required":true,"schema":{"type":"string","format":"uuid"}},{"in":"header","name":"Idempotency-Key","schema":{"type":"string"},"description":"Alternative to body idempotency_key; disagreement is rejected"}],"requestBody":{"required":true,"content":{"application/json":{"schema":{"type":"object","required":["amount"],"properties":{"idempotency_key":{"type":"string"},"amount":{"type":"string","description":"Positive exact decimal, maximum two fractional digits; cumulative pending plus completed refunds cannot exceed payment amount"}}}}}},"responses":{"200":{"description":"Completed refund or replay; PascalCase fields ID, PaymentID, IdempotencyKey, Amount, Currency, Status=SETTLED, LedgerTxID. Payment GET exposes RefundedAmount and PARTIALLY_REFUNDED or REFUNDED."},"400":{"description":"Invalid UUID/JSON/key/amount/state or cumulative refund cap exceeded"},"409":{"description":"Refund key reused for a different payment or amount"},"503":{"description":"Payment lookup/storage/ledger unavailable; pending reservations recover with original ledger identity"}}}},"/v1/reconciliation":{"get":{"summary":"PLANNED: not implemented","responses":{"200":{"description":"Planned reconciliation"}}}}},"components":{"schemas":{"CreatePayment":{"type":"object","required":["idempotency_key","source_account","dest_account","amount","currency"],"properties":{"idempotency_key":{"type":"string"},"source_account":{"type":"string"},"dest_account":{"type":"string"},"amount":{"type":"string","description":"Exact decimal amount"},"currency":{"type":"string","description":"Three-letter currency"}}},"CreatePaymentResponse":{"type":"object","required":["payment_id"],"properties":{"payment_id":{"type":"string","format":"uuid"}}},"Payment":{"type":"object","description":"Current JSON field names are Go PascalCase: ID, IdempotencyKey, SourceAccount, DestAccount, Amount, Currency, Status, LedgerTxID. Status is PENDING, PROCESSING (durable ledger intent awaiting completion), SCREENED (review), FAILED (deny), or SETTLED. LedgerTxID is a UUID string on settlement and null beforehand. RefundedAmount is the exact completed refund total. Apply migrations 001, 002 and 003 for Postgres recovery. Memory state and simulated ledger are not restart durable."}}}}